# Gradle / JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# 本工程工作区路径含中文（E:\Desktop\宋词辅助），AGP 默认对这个直接报错。
# 实测 Windows 上 JDK17 + Gradle 8.7 + AGP 8.5.2 能正常构建（见 README「本地验证记录」），
# 因此显式关掉该路径检查；若在别的中文路径下遇到离奇失败，优先怀疑这里。
android.overridePathCheck=true

# 版本基线（可在 app/build.gradle.kts 里被覆盖）
songci.compileSdk=34
songci.minSdk=26
songci.targetSdk=34
songci.versionCode=32
songci.versionName=0.11.3
