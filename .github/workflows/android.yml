name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) 索引与匹配算法的 Python 侧复算（不需要 Android SDK，秒级）
  # ---------------------------------------------------------------------------
  verify-index:
    name: 索引与匹配复算
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 重新生成索引并校验
        run: |
          # 游戏数据（data/*.json）不在仓库里（属于游戏素材），所以 CI 无法重新生成，
          # 只能校验已提交的索引自身是否自洽、以及与提交版本是否一致。
          if [ -f data/SongCiVerseConfig.json ]; then
            python tools/gen_verse_index.py
          else
            echo "data/ 未提供游戏数据（预期如此）→ 跳过重新生成，改为校验已提交的索引"
            python tools/gen_verse_index.py --check
          fi
          python tools/check_index_committed.py

      - name: 匹配算法复算（性质检查 + 阈值扫描）
        run: python tools/tune_matcher.py --samples 2000 | tee matcher-report.txt

      - name: 上传复算报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: matcher-report
          path: matcher-report.txt

  # ---------------------------------------------------------------------------
  # 2) JVM 单元测试 + 打包 APK
  # ---------------------------------------------------------------------------
  build:
    name: 单测与打包
    runs-on: ubuntu-latest
    needs: verify-index
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 版本自检
        run: |
          set -euo pipefail
          WRAPPER_VERSION=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)
          echo "wrapper 锁定版本: $WRAPPER_VERSION"
          test "$WRAPPER_VERSION" = "8.7" || { echo "::error::CI 与 wrapper 版本不一致"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "::error::缺少 gradle-wrapper.jar"; exit 1; }
          gradle --version

      - name: 单元测试
        run: gradle --no-daemon testDebugUnitTest

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: 打包 debug
        run: gradle --no-daemon assembleDebug

      # 注意：`secrets` 不能用在 step/job 的 if 里（会让整个 workflow 解析失败），
      # 所以这里在脚本内部判断有没有密钥，而不是用 if 做条件。
      - name: 准备签名密钥（有 Secrets 才写 keystore.properties）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::没有配置 KEYSTORE_BASE64，release 将出未签名包"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app-release.jks
          printf 'storeFile=app-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "签名密钥已就绪（alias=$KEY_ALIAS）"

      - name: 打包 release
        run: gradle --no-daemon assembleRelease

      - name: 校验 release 签名与关键内容
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          if [ -f keystore.properties ]; then
            echo "--- 签名校验（应为 SongCi Assist 证书）---"
            "${BT}apksigner" verify --print-certs "$APK"
          else
            echo "--- 未签名产物，跳过签名校验 ---"
          fi
          python tools/check_apk.py verify "$APK" || true

      - name: 清理签名密钥
        if: always()
        run: rm -f app-release.jks keystore.properties

      - name: 汇总产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -lh out

      - name: 上传 APK
        uses: actions/upload-artifact@v6
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: warn
